<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">人体主要免疫器官</title>
  <desc id="desc">人体免疫器官教学示意，区分中枢或初级免疫器官与外周或次级免疫器官。</desc>
  <defs>
    <style>
      .title { font: 500 30px 'Microsoft YaHei UI', 'Noto Sans SC', sans-serif; fill: #EEF3F2; }
      .subtitle { font: 400 15px 'Microsoft YaHei UI', 'Noto Sans SC', sans-serif; fill: #9EAAA8; }
      .label { font: 500 15px 'Microsoft YaHei UI', 'Noto Sans SC', sans-serif; fill: #E8EEEC; }
      .bodycopy { font: 400 13px 'Microsoft YaHei UI', 'Noto Sans SC', sans-serif; fill: #AEB9B6; }
      .small { font: 400 12px 'Microsoft YaHei UI', 'Noto Sans SC', sans-serif; fill: #84928F; }
      .primary { font: 500 14px 'Microsoft YaHei UI', 'Noto Sans SC', sans-serif; fill: #69D5BA; }
      .secondary { font: 500 14px 'Microsoft YaHei UI', 'Noto Sans SC', sans-serif; fill: #F2B55C; }
      .body { fill: #202829; stroke: #4A5A59; stroke-width: 2; }
      .rib { fill: none; stroke: #536260; stroke-width: 1.2; opacity: .55; }
      .leader { fill: none; stroke-width: 1.35; opacity: .9; }
      .card { fill: #222B2D; stroke: #394648; stroke-width: 1; }
    </style>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="#121718"/>
  <rect x="24" y="24" width="1152" height="852" rx="24" fill="#1A2022" stroke="#303A3D"/>

  <text x="64" y="76" class="title">人体主要免疫器官</text>
  <text x="64" y="106" class="subtitle">中枢器官负责免疫细胞发育；外周器官负责捕获抗原并启动免疫应答</text>

  <g transform="translate(814 126)">
    <circle cx="8" cy="8" r="6" fill="#42C1A4"/>
    <text x="24" y="13" class="primary">中枢 / 初级</text>
    <path d="M194 3 L201 8 L194 13 L187 8 Z" fill="#F0A43A"/>
    <text x="214" y="13" class="secondary">外周 / 次级</text>
  </g>

  <!-- Simplified anterior body silhouette for anatomical context. -->
  <g>
    <circle cx="600" cy="210" r="48" class="body"/>
    <rect x="578" y="254" width="44" height="48" rx="16" class="body"/>
    <path d="M575 292 C530 304 492 325 480 367 L456 650 L516 663 L548 510
             L540 807 L585 807 L600 620 L615 807 L660 807 L652 510
             L684 663 L744 650 L720 367 C708 325 670 304 625 292 Z" class="body"/>
    <g class="rib">
      <path d="M535 360 Q600 326 665 360"/>
      <path d="M525 392 Q600 354 675 392"/>
      <path d="M525 424 Q600 386 675 424"/>
    </g>
  </g>

  <!-- Primary lymphoid organs: bone marrow and thymus. -->
  <g filter="url(#glow)">
    <path d="M600 352 L600 478" fill="none" stroke="#42C1A4" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 7" opacity=".85"/>
    <path d="M610 382 C591 377 574 389 574 405 C574 423 591 433 608 426 C625 433 642 423 642 405 C642 389 625 377 610 382 Z" fill="#42C1A4" opacity=".95"/>
    <circle cx="574" cy="405" r="5" fill="#80E7D1"/>
    <circle cx="642" cy="405" r="5" fill="#80E7D1"/>
  </g>

  <!-- Secondary organ positions. -->
  <g fill="#F0A43A">
    <circle cx="584" cy="300" r="5"/>
    <circle cx="616" cy="300" r="5"/>
    <circle cx="566" cy="337" r="4"/>
    <circle cx="634" cy="337" r="4"/>
    <circle cx="504" cy="382" r="4.5"/>
    <circle cx="696" cy="382" r="4.5"/>
    <circle cx="528" cy="646" r="4"/>
    <circle cx="672" cy="646" r="4"/>
    <circle cx="574" cy="548" r="3.5"/>
    <circle cx="600" cy="560" r="3.5"/>
    <circle cx="626" cy="548" r="3.5"/>
    <circle cx="685" cy="532" r="2.5"/>
    <circle cx="690" cy="548" r="2.5"/>
    <circle cx="681" cy="563" r="2.5"/>
  </g>
  <path d="M690 514 C708 504 724 518 721 538 C718 559 699 573 683 561 C691 546 694 530 690 514 Z" fill="#F0A43A"/>
  <path d="M556 614 C568 606 637 606 649 614" fill="none" stroke="#F0A43A" stroke-width="8" stroke-linecap="round" opacity=".8"/>
  <path d="M552 635 C542 652 548 670 562 681" fill="none" stroke="#F0A43A" stroke-width="5" stroke-linecap="round"/>

  <!-- Peripheral lymphatic vessels. -->
  <g fill="none" stroke="#6E8580" stroke-width="1.5" stroke-dasharray="4 5" opacity=".8">
    <path d="M584 300 Q530 350 504 382 L528 646"/>
    <path d="M616 300 Q670 350 696 382 L672 646"/>
    <path d="M574 548 Q600 528 626 548"/>
    <path d="M600 560 Q640 630 672 646"/>
  </g>

  <!-- Leader lines and primary labels. -->
  <g class="leader" stroke="#42C1A4">
    <path d="M350 382 C430 382 520 365 596 360"/>
    <path d="M350 520 C445 520 520 455 576 407"/>
  </g>
  <circle cx="596" cy="360" r="5" fill="#42C1A4"/>
  <circle cx="576" cy="407" r="5" fill="#42C1A4"/>

  <g>
    <rect x="62" y="338" width="288" height="88" rx="12" class="card"/>
    <rect x="62" y="338" width="4" height="88" rx="2" fill="#42C1A4"/>
    <text x="82" y="368" class="label">骨髓</text>
    <text x="82" y="392" class="bodycopy">造血干细胞来源；B 细胞在骨髓成熟</text>
    <text x="82" y="412" class="small">红骨髓主要位于胸骨、肋骨和骨盆等</text>

    <rect x="62" y="476" width="288" height="88" rx="12" class="card"/>
    <rect x="62" y="476" width="4" height="88" rx="2" fill="#42C1A4"/>
    <text x="82" y="506" class="label">胸腺</text>
    <text x="82" y="530" class="bodycopy">T 细胞发育、筛选与成熟</text>
    <text x="82" y="550" class="small">位于胸骨后方、心脏上方</text>
  </g>

  <!-- Leader lines and secondary labels. -->
  <g class="leader" stroke="#F0A43A">
    <path d="M850 286 C790 286 670 292 622 302"/>
    <path d="M850 388 C760 388 720 384 702 382"/>
    <path d="M850 516 C780 516 744 525 724 536"/>
    <path d="M850 640 C780 640 690 625 648 613"/>
  </g>
  <g>
    <rect x="846" y="278" width="292" height="86" rx="12" class="card"/>
    <rect x="846" y="278" width="4" height="86" rx="2" fill="#F0A43A"/>
    <text x="866" y="308" class="label">扁桃体与腺样体</text>
    <text x="866" y="332" class="bodycopy">口鼻入口处的黏膜相关淋巴组织</text>
    <text x="866" y="352" class="small">共同参与咽淋巴环</text>

    <rect x="846" y="380" width="292" height="86" rx="12" class="card"/>
    <rect x="846" y="380" width="4" height="86" rx="2" fill="#F0A43A"/>
    <text x="866" y="410" class="label">淋巴结</text>
    <text x="866" y="434" class="bodycopy">过滤淋巴，组织抗原与淋巴细胞相遇</text>
    <text x="866" y="454" class="small">颈部、腋窝、肠系膜与腹股沟等多处分布</text>

    <rect x="846" y="508" width="292" height="86" rx="12" class="card"/>
    <rect x="846" y="508" width="4" height="86" rx="2" fill="#F0A43A"/>
    <text x="866" y="538" class="label">脾</text>
    <text x="866" y="562" class="bodycopy">过滤血液并对血源性抗原产生应答</text>
    <text x="866" y="582" class="small">位于左上腹；白髓含淋巴组织</text>

    <rect x="846" y="632" width="292" height="98" rx="12" class="card"/>
    <rect x="846" y="632" width="4" height="98" rx="2" fill="#F0A43A"/>
    <text x="866" y="662" class="label">肠道相关淋巴组织</text>
    <text x="866" y="686" class="bodycopy">Peyer 集合、阑尾及其他黏膜淋巴结构</text>
    <text x="866" y="706" class="small">识别肠腔抗原并参与黏膜免疫</text>
  </g>

  <g>
    <rect x="64" y="776" width="510" height="62" rx="12" fill="#1F2829" stroke="#33403F"/>
    <text x="84" y="802" class="primary">中枢 / 初级免疫器官</text>
    <text x="84" y="824" class="bodycopy">骨髓 → B 细胞；骨髓前体 → 胸腺 → T 细胞</text>

    <rect x="626" y="776" width="510" height="62" rx="12" fill="#1F2829" stroke="#33403F"/>
    <text x="646" y="802" class="secondary">外周 / 次级免疫器官</text>
    <text x="646" y="824" class="bodycopy">淋巴结、脾和黏膜相关淋巴组织是免疫应答主要场所</text>
  </g>

  <text x="64" y="858" class="small">依据 NCBI Bookshelf 与 NIAID 基础免疫资料绘制 · 教学示意，不按真实解剖比例，不用于诊断</text>
</svg>
